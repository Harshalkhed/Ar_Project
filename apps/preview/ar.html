<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>WebAR Image Tracking Test</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #e8e8e8; font: 14px/1.4 system-ui, sans-serif; }
    #camera { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #viewport { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #status { position: fixed; left: 12px; right: 12px; bottom: 12px; margin: 0; padding: 8px 12px; border-radius: 6px; background: rgb(0 0 0 / 0.6); z-index: 2; }
    #status[data-state="error"] { background: #7a1f1f; }
    #status[data-state="tracking"] { background: #1f7a3f; }
    #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 3; background: #000; }
    #start button { font-size: 18px; padding: 14px 28px; border-radius: 8px; border: none; background: #2a6df4; color: #fff; }
  </style>
</head>
<body>
  <video id="camera" autoplay muted playsinline></video>
  <canvas id="viewport"></canvas>
  <p id="status">Loading…</p>
  <div id="start"><button id="start-button">Point camera at target</button></div>
  <script type="module" src="./src/ar.ts"></script>
</body>
</html>
