<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brochure Page</title>
  <style>
    :root { --ink: #16181d; --muted: #555b66; --line: #ddd9d2; --desk: #e9e6e0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--desk); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; }
    .toolbar button, .toolbar a { min-height: 44px; padding: 10px 16px; border-radius: 9px; font: 600 15px/1 system-ui, sans-serif; text-decoration: none; display: inline-flex; align-items: center; }
    .toolbar button { background: #2a5bd7; color: #fff; border: none; cursor: pointer; }
    .toolbar a { color: var(--ink); border: 1px solid #b9b5ad; background: #fff; }
    /* One A4 sheet: 210 × 297 mm. On screen it is scaled to fit the width. */
    .sheet { width: 210mm; min-height: 297mm; margin: 0 auto 32px; background: #fff; padding: 16mm 16mm 14mm; display: flex; flex-direction: column; box-shadow: 0 2px 18px rgb(0 0 0 / 0.12); }
    .eyebrow { margin: 0; font-size: 11pt; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    h1 { font: 600 30pt/1.1 Georgia, "Times New Roman", serif; margin: 3mm 0 3mm; }
    .pitch { margin: 0 0 7mm; font-size: 13pt; color: var(--muted); }
    .target { width: 128mm; height: 170.7mm; display: block; margin: 0 auto; border: 0.3mm solid var(--line); }
    .scan { margin-top: auto; display: flex; gap: 8mm; align-items: center; padding-top: 7mm; border-top: 0.3mm solid var(--line); }
    .scan .code svg { width: 36mm; height: 36mm; display: block; }
    .scan ol { margin: 0; padding-left: 5mm; font-size: 11.5pt; }
    .scan li + li { margin-top: 1.5mm; }
    .url { margin: 2mm 0 0; font-size: 9pt; color: var(--muted); word-break: break-all; }
    @page { size: A4; margin: 0; }
    @media print { html, body { background: #fff; } .toolbar { display: none; } .sheet { margin: 0; box-shadow: none; zoom: 1 !important; } }
  </style>
</head>
<body>
  <div class="toolbar">
    <button type="button" id="print">Print or save as PDF</button>
    <a href="demos.html">All demos</a>
  </div>
  <section class="sheet" id="sheet" aria-live="polite"><p>Loading…</p></section>
  <script type="module" src="./src/brochure.ts"></script>
</body>
</html>
