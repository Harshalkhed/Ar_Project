<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WebXR Room Placement Test</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #e8e8e8; font: 14px/1.4 system-ui, sans-serif; }
    #viewport { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #status { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); margin: 0; padding: 8px 12px; border-radius: 6px; background: rgb(0 0 0 / 0.6); z-index: 2; }
    #status[data-state="error"] { background: #7a1f1f; }
    #scale-badge { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left)); z-index: 2; padding: 6px 10px; border-radius: 6px; background: rgb(0 0 0 / 0.6); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <canvas id="viewport"></canvas>
  <div id="scale-badge">100%</div>
  <p id="status">Checking WebXR support…</p>
  <script type="module" src="./src/webxr.ts"></script>
</body>
</html>
