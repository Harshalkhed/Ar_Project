<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WebAR Runtime Preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #20232a; color: #e8e8e8; font: 14px/1.4 system-ui, sans-serif; }
    #viewport { display: block; width: 100%; height: 100%; touch-action: none; }
    #bottom { position: fixed; left: calc(12px + env(safe-area-inset-left)); right: calc(12px + env(safe-area-inset-right)); bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 12px; }
    #ar-link { min-height: 48px; padding: 12px 28px; box-sizing: border-box; border-radius: 10px; background: #2a6df4; color: #fff; font: 600 18px/24px system-ui, sans-serif; text-decoration: none; }
    #status { align-self: stretch; margin: 0; padding: 8px 12px; border-radius: 6px; background: rgb(0 0 0 / 0.6); }
    #status[data-state="error"] { background: #7a1f1f; }
  </style>
</head>
<body>
  <canvas id="viewport"></canvas>
  <div id="bottom">
    <!-- Room placement (WebXR on Android, Quick Look on iPhone) is its own page; main.ts carries ?project over. -->
    <a id="ar-link" href="webxr.html">View in your room (AR)</a>
    <p id="status">Loading preview…</p>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
